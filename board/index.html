<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>品德教育｜首頁公告</title>
<style>
body{margin:0;background:#fff;color:#212121;font-family:Lato,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
section{padding:4px 8px 18px}
h2{font-size:22px;font-weight:400;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:20px 28px}
.card{display:block;width:330px;max-width:100%}
.card img{display:block;width:100%;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.month{font-size:14px;color:#6b6b6b}
.name{font-size:30px;font-weight:700;margin:2px 0 12px}
.btn{display:inline-block;background:#D99100;color:#fff;text-decoration:none;padding:8px 18px;border-radius:4px;font-size:15px}
.btn:hover{background:#b87b00}
.empty{font-size:15px;color:#6b6b6b;margin:0}
.more{font-size:14px;color:#b87b00;margin-left:10px;text-decoration:none;border-bottom:1px solid #e8c77a}
.tbl{overflow-x:auto}
table{border-collapse:collapse;min-width:520px;width:100%;font-size:15px}
th,td{border-bottom:1px solid #eee;padding:8px 10px;text-align:left;vertical-align:top}
tr:first-child th{background:#FFF4D6;font-weight:700;border-bottom:2px solid #F2C14E}
td{width:30%}
tr th:first-child{white-space:nowrap;color:#555;font-weight:400}
.chip{display:inline-block;background:#FFEE92;border-radius:12px;padding:2px 10px;margin:2px 6px 2px 0}
.none{color:#bbb}
ul.news{list-style:none;margin:0;padding:0}
ul.news li{display:flex;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px solid #f0e6cc}
ul.news li:last-child{border-bottom:0}
.date{flex:0 0 auto;background:#FFF4D6;color:#8a6a12;border-radius:12px;padding:2px 10px;font-size:13px;white-space:nowrap}
.ntxt{flex:1 1 auto}
.nt{font-size:16px;color:#212121;text-decoration:none;font-weight:600}
a.nt:hover{color:#b87b00;text-decoration:underline}
.nd{margin:4px 0 0;font-size:14px;color:#5f5f5f;line-height:1.5}
.item{border-bottom:1px solid #f0e6cc}
.item:last-child{border-bottom:0}
.item>summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:baseline;padding:10px 0}
.item>summary::-webkit-details-marker{display:none}
.item>summary::after{content:'＋';margin-left:auto;color:#b87b00;font-size:15px;flex:0 0 auto}
.item[open]>summary::after{content:'－'}
.item>summary:hover .nt{color:#b87b00;text-decoration:underline}
.item .body{padding:0 0 12px 0}
.item.past{opacity:.5}
.item.past .date{background:#eee;color:#888}
.tag{flex:0 0 auto;background:#eee;color:#777;border-radius:10px;padding:1px 8px;font-size:12px}
.lnks{margin:6px 0 0}
.lnk{display:inline-block;background:#FFF4D6;color:#8a6a12;border:1px solid #eed9a3;border-radius:4px;
     padding:2px 10px;margin:0 8px 0 0;font-size:13px;text-decoration:none}
.lnk:hover{background:#F7E7BC}
.nd.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mnote{display:none}
.err{padding:12px;color:#8a6a12;background:#FFF4D6;border-radius:6px;font-size:14px}

/* 手機：協作平台會把內嵌框壓成固定比例，內容放不下會被切掉，
   所以窄畫面改成一行一項的精簡版，詳細內容點連結看。 */
@media (max-width:700px){
  section{padding:0 8px 6px}
  h2{font-size:15px;margin:0 0 2px}
  .more{font-size:12px;margin-left:8px}
  .row{gap:8px}
  .card{display:none}
  .month{display:inline;font-size:12px}
  .name{display:inline;font-size:15px;margin:0 0 0 6px}
  .btn{display:inline-block;padding:2px 8px;font-size:12px;margin-left:8px}
  .empty{font-size:13px}
  .tbl{display:none}
  .mnote{display:block;font-size:12px;color:#6b6b6b;margin:0}
  ul.news li{padding:3px 0;gap:8px}
  ul.news li:nth-child(n+2){display:none}
  .date{font-size:11px;padding:1px 8px}
  .nt{font-size:13px}
  .nd{display:none}
  .lnks{display:none}
  .item>summary{padding:3px 0;gap:8px}
  .item .body{padding:0 0 6px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
var CONFIG = {
  SHEET_ID: '1tua7tuedY9Tr-fpcs6Ag-dgjsDrv6NKR8KP45A1cpmg',
  PUB_KEY: '2PACX-1vRp0c31mAWt7jZDm_U04ELijxrzZ3ZPeonP4vCp-o35SlXYDpI6ZKa69_tZknBpIKfu1fxTbTlpmUOT',
  GID: { plan: '0', crowns: '274365739', news: '1169110706' },
  SITE_BASE: 'https://sites.google.com/kfps.tp.edu.tw/pinde/virtues/',
  CROWNS_PAGE: 'https://sites.google.com/kfps.tp.edu.tw/pinde/crowns',
  NEWS_PAGE: 'https://sites.google.com/kfps.tp.edu.tw/pinde/news',
  HOME_NEWS: 3
};
var VIRTUES = ['尊重','同理心','正直','公平','感恩','寬容','負責','自律','善良',
               '謙遜','守信','互助','誠實','合作','毅力','勇氣','獨立','有禮'];
var CROWN_CATS = ['行儀楷模','自律典範','整潔實踐'];
var GRADES = ['一年級','二年級','三年級','四年級','五年級','六年級'];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ---- CSV ---- */
function parseCSV(text){
  var rows=[],row=[],cur='',q=false,i=0;
  for(;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else if(c==='"'){ q=true; }
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c!=='\r'){ cur+=c; }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function urls(gid){
  return ['https://docs.google.com/spreadsheets/d/e/'+CONFIG.PUB_KEY+'/pub?gid='+gid+'&single=true&output=csv',
          'https://docs.google.com/spreadsheets/d/'+CONFIG.SHEET_ID+'/gviz/tq?tqx=out:csv&gid='+gid];
}
function load(gid){
  var list=urls(gid);
  function tryOne(n){
    if(n>=list.length) return Promise.reject(new Error('all failed'));
    return fetch(list[n],{credentials:'omit'}).then(function(r){
      if(!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function(t){
      if(/^\s*</.test(t)) throw new Error('html');
      return parseCSV(t);
    }).catch(function(){ return tryOne(n+1); });
  }
  return tryOne(0);
}

/* ---- 解析 ---- */
function parseMonth(text){
  var m=String(text).match(/(\d+)\s*年\s*(\d+)\s*月/);
  return m?[Number(m[1])+1911,Number(m[2])]:null;
}
function rocLabel(y,m){ return (y-1911)+'年'+m+'月'; }
function parseDate(text){
  var t=String(text).trim();
  var m=t.match(/(\d{2,4})\s*[\/\-年.]\s*(\d{1,2})\s*[\/\-月.]\s*(\d{1,2})/);
  if(!m) return null;
  var y=Number(m[1]); if(y<1911) y+=1911;
  var mo=Number(m[2]), d=Number(m[3]);
  if(mo<1||mo>12||d<1||d>31) return null;
  return [y,mo,d];
}
function rocDate(d){ return (d[0]-1911)+'年'+d[1]+'月'+d[2]+'日'; }
/* 一格可能寫「115/9/14-115/11/15」＝活動期間，取第一個與最後一個日期 */
function parseDates(text){
  var re=/(\d{2,4})\s*[\/\-年.]\s*(\d{1,2})\s*[\/\-月.]\s*(\d{1,2})/g,m,out=[];
  while((m=re.exec(String(text)))){
    var y=Number(m[1]); if(y<1911) y+=1911;
    var mo=Number(m[2]), d=Number(m[3]);
    if(mo>=1&&mo<=12&&d>=1&&d<=31) out.push([y,mo,d]);
  }
  return out;
}
function dayKey(d){ return d[0]*10000+d[1]*100+d[2]; }
function rangeLabel(a,b){
  if(dayKey(a)===dayKey(b)) return rocDate(a);
  return rocDate(a)+'～'+(a[0]===b[0]? b[1]+'月'+b[2]+'日' : rocDate(b));
}
function splitClasses(text){
  return String(text||'').split(/[、,，;；\/\s]+/).map(function(t){
    t=t.trim();
    var m=t.match(/^[1-6](\d{2})$/);
    return m?Number(m[1])+'班':t;
  }).filter(function(t){return t;});
}

function lookupVirtue(rows,y,m){
  for(var i=1;i<rows.length;i++){
    var ym=parseMonth(rows[i][0]);
    if(ym&&ym[0]===y&&ym[1]===m){
      var v=String(rows[i][1]||'').trim();
      return VIRTUES.indexOf(v)>=0?v:'';
    }
  }
  return '';
}
function latestCrowns(rows,y,m){
  if(!rows.length) return null;
  var head=rows[0]||[];
  var col=CROWN_CATS.map(function(c){return head.indexOf(c);});
  var gCol=head.indexOf('年級');
  var byMonth={};
  for(var i=1;i<rows.length;i++){
    var ym=parseMonth(rows[i][0]);
    if(!ym||ym[0]*12+ym[1]>y*12+m) continue;
    var cells=col.map(function(c){return c>=0?splitClasses(rows[i][c]):[];});
    if(!cells.some(function(x){return x.length;})) continue;
    var key=ym[0]*12+ym[1];
    if(!byMonth[key]) byMonth[key]={label:rocLabel(ym[0],ym[1]),rows:{}};
    byMonth[key].rows[String(rows[i][gCol]||'').trim()]=cells;
  }
  var keys=Object.keys(byMonth).map(Number).sort(function(a,b){return b-a;});
  if(!keys.length) return null;
  var hit=byMonth[keys[0]];
  return {label:hit.label,grades:GRADES.map(function(g){
    return {grade:g,cells:hit.rows[g]||[[],[],[]]};})};
}
function newsList(rows){
  var out=[];
  for(var i=1;i<rows.length;i++){
    var ds=parseDates(rows[i][0]);
    var d=ds[0]||null;
    var title=String(rows[i][1]||'').trim();
    var desc=String(rows[i][2]||'').trim();
    var url=String(rows[i][3]||'').trim();
    var file=String(rows[i][4]||'').trim();
    if(!d||!title){
      /* 日期、標題留白＝接續上一則（說明可以分好幾列打） */
      if(out.length&&(desc||url||file)){
        var prev=out[out.length-1];
        if(desc) prev.desc=prev.desc?prev.desc+'\n'+desc:desc;
        if(url&&!prev.url) prev.url=url;
        if(file&&!prev.file) prev.file=file;
      }
      continue;
    }
    var end=ds[ds.length-1];
    out.push({key:dayKey(d),endKey:dayKey(end),label:rangeLabel(d,end),
      title:title,desc:desc,url:url,file:file});
  }
  out.sort(function(a,b){return b.key-a.key;});
  return out;
}
/* 結束日期早於今天（台北）＝過期 */
function markPast(list,todayKey){
  list.forEach(function(n){ n.past = n.endKey < todayKey; });
  return list;
}
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function linkRow(n){
  var a='';
  if(n.url)  a+='<a class="lnk" href="'+esc(n.url)+'" target="_blank" rel="noopener">相關連結</a>';
  if(n.file) a+='<a class="lnk" href="'+esc(n.file)+'" target="_blank" rel="noopener">附件</a>';
  return a?'<p class="lnks">'+a+'</p>':'';
}

/* ---- 畫面 ----
   注意：協作平台的內嵌 iframe 沒有 allow-top-navigation，target="_top" 會被擋住、
   點了完全沒反應，所以所有外連一律用 target="_blank"（sandbox 有 allow-popups）。 */
function renderVirtue(label,name){
  var body;
  if(name){
    var no=('0'+(VIRTUES.indexOf(name)+1)).slice(-2);
    var url=CONFIG.SITE_BASE+no;
    var pic='<a class="card" href="'+url+'" target="_blank" rel="noopener">'+
      '<img src="cards/'+no+'_'+name+'.png" alt="'+esc(name)+'"></a>';
    body='<div class="row">'+pic+'<div class="meta"><div class="month">'+esc(label)+'</div>'+
      '<div class="name">'+esc(name)+'</div>'+
      '<a class="btn" href="'+url+'" target="_blank" rel="noopener">認識「'+esc(name)+'」</a></div></div>';
  } else {
    body='<p class="empty">'+esc(label)+'的德目尚未公布，歡迎先瀏覽下方的十八項德目。</p>';
  }
  return '<section><h2>本月德目</h2>'+body+'</section>';
}
function renderCrowns(data){
  var more='<a class="more" href="'+CONFIG.CROWNS_PAGE+'" target="_blank" rel="noopener">實施要點</a>';
  if(!data) return '<section><h2>品德三冠王 '+more+'</h2><p class="empty">得獎班級尚未公布。</p></section>';
  var th='<tr><th></th>'+CROWN_CATS.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr>';
  var trs=data.grades.map(function(r){
    return '<tr><th>'+r.grade+'</th>'+r.cells.map(function(list){
      return '<td>'+(list.length
        ? list.map(function(c){return '<span class="chip">'+esc(c)+'</span>';}).join('')
        : '<span class="none">—</span>')+'</td>';
    }).join('')+'</tr>';
  }).join('');
  return '<section><h2>'+esc(data.label)+' 品德三冠王 '+more+'</h2>'+
    '<p class="mnote">得獎班級請用電腦版查看。</p>'+
    '<div class="tbl"><table>'+th+trs+'</table></div></section>';
}
function renderNews(list,limit){
  if(limit){
    /* 首頁摘要：過期的自動下架，標題點了跳到活動訊息頁 */
    var live=list.filter(function(n){return !n.past;});
    var head='<h2>活動訊息 <a class="more" href="'+CONFIG.NEWS_PAGE+'" target="_blank" rel="noopener">看全部</a></h2>';
    if(!live.length) return '<section>'+head+'<p class="empty">目前沒有活動訊息。</p></section>';
    var items=live.slice(0,limit).map(function(n){
      return '<li><span class="date">'+esc(n.label)+'</span><div class="ntxt">'+
        '<a class="nt" href="'+CONFIG.NEWS_PAGE+'" target="_blank" rel="noopener">'+esc(n.title)+'</a>'+
        (n.desc?'<p class="nd clamp">'+nl2br(n.desc)+'</p>':'')+'</div></li>';
    }).join('');
    return '<section>'+head+'<ul class="news">'+items+'</ul></section>';
  }
  /* 活動訊息整頁：收折式，未結束的排前面，過期的變暗 */
  if(!list.length) return '<section><h2>活動訊息</h2><p class="empty">目前沒有活動訊息。</p></section>';
  var sorted=list.slice().sort(function(a,b){
    if(a.past!==b.past) return a.past?1:-1;
    return b.key-a.key;
  });
  var items=sorted.map(function(n){
    return '<details class="item'+(n.past?' past':'')+'">'+
      '<summary><span class="date">'+esc(n.label)+'</span>'+
      '<span class="nt">'+esc(n.title)+'</span>'+
      (n.past?'<span class="tag">已結束</span>':'')+'</summary>'+
      '<div class="body">'+(n.desc?'<p class="nd">'+nl2br(n.desc)+'</p>':'')+linkRow(n)+'</div>'+
      '</details>';
  }).join('');
  return '<section><h2>活動訊息</h2><div class="news">'+items+'</div></section>';
}

/* ---- 主流程 ---- */
(function(){
  var view=(new URLSearchParams(location.search)).get('view')||'all';
  var now=new Date();
  var tw=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Taipei'}));
  var y=tw.getFullYear(), m=tw.getMonth()+1;
  var today=y*10000+m*100+tw.getDate();
  var app=document.getElementById('app');

  if(view==='news'){
    load(CONFIG.GID.news).then(function(rows){
      app.innerHTML=renderNews(markPast(newsList(rows),today),0);
    }).catch(function(){ app.innerHTML='<div class="err">資料暫時讀不到，請稍後再試。</div>'; });
    return;
  }

  var jobs=[load(CONFIG.GID.plan),load(CONFIG.GID.crowns),load(CONFIG.GID.news)]
    .map(function(p){return p.catch(function(){return null;});});
  Promise.all(jobs).then(function(r){
    var html='';
    if(view!=='crowns') html+=renderVirtue(rocLabel(y,m),r[0]?lookupVirtue(r[0],y,m):'');
    if(view!=='virtue') html+=renderCrowns(r[1]?latestCrowns(r[1],y,m):null);
    if(view==='all')    html+=renderNews(r[2]?markPast(newsList(r[2]),today):[],CONFIG.HOME_NEWS);
    app.innerHTML=html;
  });
})();
</script>
</body>
</html>
