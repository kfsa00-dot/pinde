# 每 15 分鐘把「品德教育_首頁公告」試算表抄成 board/data.json，
# 讓首頁公告不用等 Google 試算表（它偶爾要十幾秒才回應）。
name: board-data
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: board-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sheet
        run: |
          python3 - <<'PY'
          import csv, io, json, os, time, urllib.request
          KEY = '2PACX-1vRp0c31mAWt7jZDm_U04ELijxrzZ3ZPeonP4vCp-o35SlXYDpI6ZKa69_tZknBpIKfu1fxTbTlpmUOT'
          GIDS = {'plan': '0', 'crowns': '274365739', 'news': '1169110706'}
          def get(gid):
              url = ('https://docs.google.com/spreadsheets/d/e/%s/pub?gid=%s'
                     '&single=true&output=csv' % (KEY, gid))
              for i in range(4):
                  try:
                      with urllib.request.urlopen(url, timeout=60) as r:
                          t = r.read().decode('utf-8')
                      if t.lstrip().startswith('<'):
                          raise ValueError('html')
                      return [row for row in csv.reader(io.StringIO(t))]
                  except Exception as e:
                      print('retry', gid, e); time.sleep(5 * (i + 1))
              raise SystemExit('fetch failed: ' + gid)
          data = {k: get(g) for k, g in GIDS.items()}
          path = 'board/data.json'
          old = None
          if os.path.exists(path):
              with open(path, encoding='utf-8') as f:
                  old = json.load(f)
          if old and {k: old.get(k) for k in GIDS} == data:
              print('no change'); raise SystemExit(0)
          data['updated'] = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, separators=(',', ':'))
          print('written')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add board/data.json
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m 'board: 更新試算表資料'
          git pull --rebase origin main
          git push
